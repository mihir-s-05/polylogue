[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polylogue-council"
version = "0.1.0"
description = "LLM Council - A multi-agent deliberation system"
readme = "README.txt"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
council-cli = "council.cli:main"

[tool.setuptools.packages.find]
where = ["."]
